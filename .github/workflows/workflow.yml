name: Test and build
on:
  pull_request:
    branches: [ develop ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-fail-under=70

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build step
        run: |
          echo "Build Successful!"

      - name: Update README.md with build badge
        run: |
          if [ -f README.md ] && ! grep -q "workflow-badge" README.md; then
            badge='![workflow-badge](https://github.com/${{ github.repository }}/actions/workflows/workflow.yml/badge.svg)'
            sed -i "2i $badge/" README.md
          
            git config --local user.email "actions@github.com"
            git config --local user.name "GitHub Action"
          
            git add README.md
            git commit -m "Add workflow badge to README.md [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
